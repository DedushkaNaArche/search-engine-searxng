use_default_settings: true

general:
  debug: false
  instance_name: "Ded Search"

brand:
  new_issue_url: false
  docs_url: false
  public_instances: false
  wiki_url: false

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "auto"
  formats:
    - html

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "${SEARXNG_SECRET_KEY}"
  limiter: false
  image_proxy: true
  method: "POST"

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    simple_style: dark

preferences:
  lock:
    - method
    - safe_search
    - autocomplete
